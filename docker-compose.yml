services:
  comfyui:
    build: .
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./ComfyUI_data:/ComfyUI
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    command: >
      sh -c "if [ -z \"$$(ls -A /ComfyUI 2>/dev/null)\" ]; then cp -a /opt/comfyui/. /ComfyUI/; fi;
      cd /ComfyUI && python main.py --listen 0.0.0.0 --port 8188 --reserve-vram 0.4 --preview-method auto"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
